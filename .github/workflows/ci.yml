name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

# Cancela runs anteriores del mismo PR/branch cuando llega un nuevo push,
# para no gastar minutos de CI en código ya superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (reproducible, respeta package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test con cobertura (umbral mínimo 80%)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  docker:
    name: Docker build (multi-stage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t claude-code-agent:ci .
